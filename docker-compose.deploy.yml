services:
  miso-blog-front:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/}
    image: miso-blog-front:latest
    container_name: miso-blog-front
    ports:
      - "${MISO_BLOG_FRONT_PORT:-8030}:80"
    environment:
      API_UPSTREAM_HOST: ${API_UPSTREAM_HOST:-miso-blog-server}
      API_UPSTREAM_PORT: ${API_UPSTREAM_PORT:-8010}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-30m}
    restart: unless-stopped
    networks:
      - miso-blog-network

networks:
  miso-blog-network:
    external: true
    name: ${MISO_BLOG_NETWORK_NAME:-miso-blog-network}
